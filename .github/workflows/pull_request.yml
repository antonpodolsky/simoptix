# Checks a pull request's description and label each time they change, not only when its code does:
#   Changelog    the type label and the Changelog section as a release reads them (release.py --check-pr)
#   Description  check_public_text.py on the description
# The builds and the other checks are in checks.yml. No job has a secret.
# Every run finishes, with no concurrency group to cancel one. A new description or label leaves the
# commit as it is, so each run's jobs stay on the pull request's latest commit. GitHub counts a
# cancelled job there as not passed, and shows the pull request red. Opening a pull request with its
# label starts two runs at once (opened, labeled). Each run reads the description and the label from
# GitHub (gh pr view) when it runs.
name: Pull request

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

defaults:
  run:
    shell: pwsh

env:
  GH_TOKEN: ${{ github.token }}
  PR: ${{ github.event.pull_request.number }}

jobs:
  changelog:
    name: Changelog
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify changelog
        run: python -I .agents\skills\dev\release.py --check-pr $env:PR

  description:
    name: Description
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify description
        run: python -I .agents\skills\public-text\check_public_text.py --pr $env:PR
