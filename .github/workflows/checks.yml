# The checks GitHub runs on each pull request and each push to main: every part built with no
# warnings (shared\build\build_all.ps1), the formatters, the docs and public-text checks, and whether
# stage_replay's golden output changed against the build before. The e2e suite and the local files
# test run on trial: their results show in the run, but don't fail the checks, until they are known
# to work on GitHub's runners. Nothing here signs, and no job has a secret.
name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

jobs:
  build:
    name: Build every part
    runs-on: windows-latest
    steps:
      # The whole history and the tags, for the version (shared\build\version.bat).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File shared\build\build_all.ps1 -LogDir "$env:RUNNER_TEMP\build_logs"
          exit $LASTEXITCODE

      - name: Keep the build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build_logs
          path: ${{ runner.temp }}/build_logs

  format:
    name: Formatters
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install the formatters, at the versions the dev skill names
        run: python -m pip install clang-format==23.1.5 ruff==0.17.4

      - name: clang-format
        run: |
          $files = git ls-files -- '*.cpp' '*.h' '*.hlsli' ':!third_party'
          clang-format --dry-run --Werror $files
          exit $LASTEXITCODE

      - name: ruff
        run: ruff format --check

  docs_and_public_text:
    name: Docs and public text
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Docs
        run: python -I .agents\skills\docs\check_docs.py

      - name: Every file in the repo
        run: python -I .agents\skills\public-text\check_public_text.py --repo

      - name: The pull request's description and commits
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          COMMITS: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
        run: |
          python -I .agents\skills\public-text\check_public_text.py --pr $env:PR
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I .agents\skills\public-text\check_public_text.py --commits $env:COMMITS
          exit $LASTEXITCODE

  golden:
    name: stage_replay against the build before
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The build before: the first parent of the commit checked out. For a pull request that is
      # GitHub's merge commit, whose first parent is the base branch, and for a push to main the
      # main it was merged into.
      - name: Check out the build before
        run: git worktree add --detach "$env:RUNNER_TEMP\before" HEAD^1

      - name: Build stage_replay, after and before
        run: |
          cmd /c "vr_mirror\e2e\build.bat"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmd /c "$env:RUNNER_TEMP\before\vr_mirror\e2e\build.bat"
          exit $LASTEXITCODE

      - name: Compare the golden dumps
        run: |
          vr_mirror\e2e\bin\stage_replay.exe --golden "$env:RUNNER_TEMP\after.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP\before\vr_mirror\e2e\bin\stage_replay.exe" --golden "$env:RUNNER_TEMP\before.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I vr_mirror\e2e\stage_replay\golden_compare.py "$env:RUNNER_TEMP\before.txt" "$env:RUNNER_TEMP\after.txt" --markdown $env:GITHUB_STEP_SUMMARY
          if ($LASTEXITCODE -eq 2) { exit 2 }
          # A change in the output is shown, and fails nothing: many pull requests change it on purpose.
          exit 0

  tests_trial:
    name: e2e and local files test (trial)
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: What the runner has
        run: |
          Get-CimInstance Win32_VideoController | Format-Table Name, DriverVersion, VideoModeDescription
          Get-CimInstance Win32_Processor | Format-Table Name, NumberOfLogicalProcessors
          query session
          exit 0

      - name: Build
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File shared\build\build_all.ps1 -LogDir "$env:RUNNER_TEMP\build_logs"
          exit $LASTEXITCODE

      - name: e2e suite
        id: e2e
        run: |
          vr_mirror\e2e\bin\e2e_runner.exe
          exit $LASTEXITCODE

      - name: Install OBS for the local files test
        if: always() && steps.e2e.outcome != 'skipped'
        run: |
          choco install obs-studio --no-progress -y
          exit $LASTEXITCODE

      - name: Local files test
        if: always() && steps.e2e.outcome != 'skipped'
        run: |
          vr_mirror\e2e\bin\local_files_e2e.exe
          exit $LASTEXITCODE

      - name: Keep the tests' output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests_out
          path: |
            vr_mirror/e2e/out/
            !vr_mirror/e2e/out/obs_portable/
