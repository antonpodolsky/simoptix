# The checks GitHub runs on each pull request and each push to main: every part built with no
# warnings (shared\build\build_all.ps1), the formatters, the docs and public-text checks of the files
# and commits, and whether stage_replay's golden output changed against the build before. The e2e
# suite and the local files test run on trial: their results show in the run, but don't fail the
# checks, until they are known to work on GitHub's runners. pull_request.yml checks the description
# and the label. Nothing here signs, and no job has a secret.
name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

jobs:
  build:
    name: Build
    runs-on: windows-latest
    steps:
      # The whole history and the tags, for the version (shared\build\version.bat).
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build every part
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File shared\build\build_all.ps1 -LogDir "$env:RUNNER_TEMP\build_logs"
          exit $LASTEXITCODE

      - name: Upload the build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build_logs
          path: ${{ runner.temp }}/build_logs

  verify_formatting:
    name: Verify formatting
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install clang-format and ruff, at the versions the dev skill names
        run: python -m pip install clang-format==23.1.5 ruff==0.17.4

      - name: Verify the C++ and HLSL layout (clang-format)
        run: |
          $files = git ls-files -- '*.cpp' '*.h' '*.hlsli' ':!third_party'
          clang-format --dry-run --Werror $files
          exit $LASTEXITCODE

      - name: Verify the Python layout (ruff)
        run: ruff format --check

  verify_docs_and_public_text:
    name: Verify docs and public text
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify the docs
        run: python -I .agents\skills\docs\check_docs.py

      - name: Verify the public text of every file
        run: python -I .agents\skills\public-text\check_public_text.py --repo

      # The description and the label are verified by pull_request.yml, each time they change.
      - name: Verify the public text of the pull request's commits
        if: github.event_name == 'pull_request'
        env:
          COMMITS: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
        run: python -I .agents\skills\public-text\check_public_text.py --commits $env:COMMITS

  compare_stage_replay:
    name: Compare stage_replay with the build before
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The build before: the first parent of the commit checked out. For a pull request that is
      # GitHub's merge commit, whose first parent is the base branch, and for a push to main the
      # main it was merged into.
      - name: Check out the build before
        run: git worktree add --detach "$env:RUNNER_TEMP\before" HEAD^1

      - name: Build stage_replay
        run: |
          cmd /c "vr_mirror\e2e\build.bat"
          exit $LASTEXITCODE

      # A build before that doesn't build on GitHub leaves nothing to compare. It is said in the
      # summary, and fails nothing.
      - name: Build stage_replay of the build before
        id: before
        continue-on-error: true
        run: |
          cmd /c "$env:RUNNER_TEMP\before\vr_mirror\e2e\build.bat"
          exit $LASTEXITCODE

      - name: Report that the build before didn't build
        if: steps.before.outcome == 'failure'
        run: |
          "stage_replay --golden: the build before didn't build here, so there is nothing to compare." >> $env:GITHUB_STEP_SUMMARY

      - name: Compare the golden files
        if: steps.before.outcome == 'success'
        run: |
          vr_mirror\e2e\bin\stage_replay.exe --golden "$env:RUNNER_TEMP\after.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP\before\vr_mirror\e2e\bin\stage_replay.exe" --golden "$env:RUNNER_TEMP\before.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I vr_mirror\e2e\stage_replay\golden_compare.py "$env:RUNNER_TEMP\before.txt" "$env:RUNNER_TEMP\after.txt" --markdown $env:GITHUB_STEP_SUMMARY
          if ($LASTEXITCODE -eq 2) { exit 2 }
          # A change in the output is shown, and fails nothing: many pull requests change it on purpose.
          exit 0

  test_trial:
    name: Test e2e and local files (trial)
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Report the runner's graphics, processor and sessions
        run: |
          Get-CimInstance Win32_VideoController | Format-Table Name, DriverVersion, VideoModeDescription
          Get-CimInstance Win32_Processor | Format-Table Name, NumberOfLogicalProcessors
          query session
          exit 0

      - name: Build every part
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File shared\build\build_all.ps1 -LogDir "$env:RUNNER_TEMP\build_logs"
          exit $LASTEXITCODE

      - name: Test the e2e suite
        id: e2e
        run: |
          vr_mirror\e2e\bin\e2e_runner.exe
          exit $LASTEXITCODE

      - name: Install OBS for the local files test
        if: always() && steps.e2e.outcome != 'skipped'
        run: |
          choco install obs-studio --no-progress -y
          exit $LASTEXITCODE

      - name: Test the local files
        if: always() && steps.e2e.outcome != 'skipped'
        run: |
          vr_mirror\e2e\bin\local_files_e2e.exe
          exit $LASTEXITCODE

      - name: Upload the tests' output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests_out
          path: |
            vr_mirror/e2e/out/
            !vr_mirror/e2e/out/obs_portable/
